# --- Settings page ---
settings.claudePath.label=Claude command:
settings.claudePath.comment=Command name or absolute path of the claude CLI, e.g. <code>claude</code> or <code>/usr/local/bin/claude</code>
settings.baseUrl.label=API URL:
settings.baseUrl.comment=Anthropic-compatible API URL. Leave empty to use the claude CLI's own configuration; set it when using a third-party relay.
settings.apiKey.label=API Key:
settings.apiKey.comment=Leave empty to use the credentials the claude CLI is already logged in with. Saved to the plugin config file claude-commit.xml.
settings.model.label=Model:
settings.model.comment=e.g. <code>claude-sonnet-5</code>. Leave empty to use the claude CLI default model.
settings.timeout.label=Timeout (seconds):
settings.terminal.group=Terminal (independent of commit-message generation)
settings.closeTerminalOnProjectClose.label=Close the Terminal tool window before a project closes
settings.closeTerminalOnProjectClose.comment=Standalone convenience option — has nothing to do with generating commit messages. A terminal restored from the previous session has no live shell, so the panel is empty; enable this to close the Terminal as the project closes, so the saved layout no longer has it open and it stays closed next time. Requires the Terminal plugin.
settings.autoStartClaude.label=Open Claude Code automatically when no terminal is open
settings.autoStartClaude.comment=When "Send CC Reference" runs and the Terminal tool window has no tab, open a new terminal, launch the Claude CLI (the command above), and type the reference into it — instead of warning that no terminal is open. Only affects the no-terminal case; an already open terminal is used as before.
settings.switchTerminalTab.label=Switch terminal tabs with Cmd+1…9 (Alt+1…9 on Windows/Linux) while the terminal has focus
settings.switchTerminalTab.comment=With the focus inside the Terminal tool window, Cmd/Alt+N selects the N-th terminal tab instead of opening the numbered tool window. Anywhere else — when there is no N-th tab, and when that tab is already the selected one — the IDE keeps its own behavior, so pressing the same shortcut again activates the numbered tool window as usual. Requires the Terminal plugin.
settings.window.group=Project windows (independent of commit-message generation)
settings.switchProjectWindow.label=Switch project windows with Option+1…9 (macOS only)
settings.switchProjectWindow.comment=Option+N brings the N-th open project window to the front and moves the focus into it. The windows are numbered the way the IDE's own Window menu lists them — by project name — so a number keeps pointing at the same project across restarts. Works with the focus inside the terminal too, in which case Option+digit no longer reaches the shell (requires the Terminal plugin and the new terminal engine). Nothing happens when there is no N-th project; the number of the window you are already in is simply swallowed. Only bound on the macOS keymap — elsewhere Alt+1…9 belongs to the IDE tool windows, so bind your own shortcut under Settings &gt; Keymap &gt; "Switch to Project Window N".<br><b>Warning:</b> on non-US Mac keyboard layouts Option+digit is how some characters are typed (German <code>{</code> <code>}</code> = Option+8/9, Spanish <code>@</code> = Option+2). The shortcut takes those keystrokes over, so turn this option off if you need them.
settings.language.label=Commit message language:
settings.language.comment=Language of the generated commit message. "Follow IDE language" picks Chinese or English based on the IDE display language.
settings.userPrompt.label=Custom prompt (appended after the built-in commit conventions):
settings.userPrompt.comment=The built-in prompt defines the commit message format and output contract and cannot be changed; this content adds personalization such as style and tone.

